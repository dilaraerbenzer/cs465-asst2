<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Goth Moth</title>

<!--
  Shaders: Phong (per-fragment) shading from Angel & Shreiner Chapter 6,
  shadedSphere4.html (https://github.com/esangel/WebGL/blob/master/Chap6/shadedSphere4.html).
  Our modifications:
    - added vTexCoord / fTexCoord and the "texture" sampler from Chapter 7
      textureCube1.html; the lit colour is multiplied by the texture colour
      (useTexture = 0 gives the plain per-part colour)
    - directional vs. point light is chosen with lightPosition.w (the original
      tests lightPosition.z)
    - back faces flip the normal so the thin wings are lit on both sides
-->
<script id="vertex-shader" type="x-shader/x-vertex">

attribute vec4 vPosition;
attribute vec4 vNormal;
attribute vec2 vTexCoord;
varying vec3 N, L, E;
varying vec2 fTexCoord;
uniform mat4 modelViewMatrix;
uniform mat4 projectionMatrix;
uniform vec4 lightPosition;
uniform mat3 normalMatrix;

void main()
{
    vec3 pos = (modelViewMatrix * vPosition).xyz;
    if(lightPosition.w == 0.0)  L = normalize(lightPosition.xyz);
    else  L = normalize(lightPosition.xyz - pos);

    E =  -normalize(pos);
    N = normalize( normalMatrix*vNormal.xyz);
    fTexCoord = vTexCoord;
    gl_Position = projectionMatrix * modelViewMatrix * vPosition;
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">

precision mediump float;

uniform vec4 ambientProduct;
uniform vec4 diffuseProduct;
uniform vec4 specularProduct;
uniform float shininess;
uniform sampler2D texture;
uniform float useTexture;
varying vec3 N, L, E;
varying vec2 fTexCoord;

void main()
{
    vec4 fColor;

    vec3 NN = normalize(N);
    vec3 LL = normalize(L);
    vec3 EE = normalize(E);
    if (!gl_FrontFacing) NN = -NN;

    vec3 H = normalize( LL + EE );
    vec4 ambient = ambientProduct;

    float Kd = max( dot(LL, NN), 0.0 );
    vec4  diffuse = Kd*diffuseProduct;

    float Ks = pow( max(dot(NN, H), 0.0), shininess );
    vec4  specular = Ks * specularProduct;

    if( dot(LL, NN) < 0.0 ) specular = vec4(0.0, 0.0, 0.0, 1.0);

    vec4 texColor = vec4(1.0, 1.0, 1.0, 1.0);
    if (useTexture > 0.5) texColor = texture2D( texture, fTexCoord );

    fColor = (ambient + diffuse) * texColor + specular;
    fColor.a = 1.0;

    gl_FragColor = fColor;
}
</script>

<script type="text/javascript" src="Common/webgl-utils.js"></script>
<script type="text/javascript" src="Common/initShaders.js"></script>
<script type="text/javascript" src="Common/MV.js"></script>
